<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <g stroke="#06B6D4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Central ring -->
    <circle cx="50" cy="50" r="10" fill="none"/>
    
    <!-- Four outer arc segments -->
    <path d="M 50 22 A 28 28 0 0 1 78 50" />
    <path d="M 78 50 A 28 28 0 0 1 50 78" />
    <path d="M 50 78 A 28 28 0 0 1 22 50" />
    <path d="M 22 50 A 28 28 0 0 1 50 22" />
    
    <!-- Vertical axis line -->
    <line x1="50" y1="12" x2="50" y2="88" />
    
    <!-- Top and bottom dots -->
    <circle cx="50" cy="8" r="3" fill="#06B6D4" stroke="none"/>
    <circle cx="50" cy="92" r="3" fill="#06B6D4" stroke="none"/>
    
    <!-- Horizontal dashes (left) -->
    <rect x="4" y="47" width="6" height="6" rx="1" fill="#06B6D4" stroke="none"/>
    <rect x="14" y="47" width="6" height="6" rx="1" fill="#06B6D4" stroke="none"/>
    
    <!-- Horizontal dashes (right) -->
    <rect x="80" y="47" width="6" height="6" rx="1" fill="#06B6D4" stroke="none"/>
    <rect x="90" y="47" width="6" height="6" rx="1" fill="#06B6D4" stroke="none"/>
  </g>
</svg>
